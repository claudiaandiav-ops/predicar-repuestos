<!DOCTYPE html>
<
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Administrador</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <button
    id="logout"
    class="btn btn-danger mb-4">

    Cerrar sesión

</button

<div class="container mt-5">

    <h1 class="mb-4">
        🛠 Administrador de Productos
    </h1>

    <div class="card p-4">

        <div class="mb-3">
            <label>Código</label>
            <input
                type="text"
                id="codigo"
                class="form-control">
        </div>

        <div class="mb-3">
            <label>Descripción</label>
            <input
                type="text"
                id="descripcion"
                class="form-control">
        </div>

        <div class="mb-3">
            <label>Marca</label>
            <input
                type="text"
                id="marca"
                class="form-control">
        </div>

        <div class="mb-3">
            <label>Modelo</label>
            <input
                type="text"
                id="modelo"
                class="form-control">
        </div>

        <button
            id="guardar"
            class="btn btn-success">

            Guardar producto

        </button>
        <button
    id="exportarExcel"
    class="btn btn-primary mt-2 w-100">

    📥 Exportar a Excel

</button>
<input
    type="file"
    id="archivoExcel"
    accept=".xlsx,.xls"
    class="form-control mt-2">

<button
    id="importarExcel"
    class="btn btn-warning mt-2 w-100">

    📤 Importar Excel

</button>

<div
    class="progress mt-2"
    id="contenedorProgreso"
    style="display:none;height:30px;">

    <div
        id="barraProgreso"
        class="progress-bar progress-bar-striped progress-bar-animated"
        role="progressbar"
        style="width:0%">

        0%

    </div>

</div>

<button
    id="cancelarEdicion"
    class="btn btn-secondary mt-2 w-100"
    style="display:none;">

    Cancelar edición

</button>

    </div>

</div>
<div class="row mt-4 mb-4">

    <div class="col-md-4 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h6>📦 Total productos</h6>
                <h2 id="dashProductos">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h6>📚 Stock total</h6>
                <h2 id="dashStock">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h6>💰 Valor inventario</h6>
                <h2 id="dashValor">S/ 0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h6>⚠ Sin stock</h6>
                <h2 id="dashSinStock">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h6>🖼 Sin imagen</h6>
                <h2 id="dashSinImagen">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h6>📂 Categorías</h6>
                <h2 id="dashCategorias">0</h2>
            </div>
        </div>
    </div>

</div>
<hr class="mt-5">

<h3 class="mt-4">Productos registrados</h3>
<p
    id="contadorProductos"
    class="text-muted mb-3">
</p>

<div class="mb-3">

    <input
        type="text"
        id="buscarProducto"
        class="form-control"
        placeholder="Buscar por código, descripción, marca o modelo">

</div>

<div id="tablaProductos"></div>

<div
    id="paginacion"
    class="mt-3 text-center">
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/admin.js"></script>

</body>

</html>
