<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Producto | Predicar Repuestos</title>

    <meta
        id="meta-description"
        name="description"
        content="Consulta información y precio de repuestos automotrices en Predicar Repuestos."
    >

    <meta name="robots" content="index, follow">

    <link
        id="canonical"
        rel="canonical"
        href="https://claudiaandiav-ops.github.io/predicar-repuestos/producto.html"
    >

    <meta
        id="og-title"
        property="og:title"
        content="Producto | Predicar Repuestos"
    >

    <meta
        id="og-description"
        property="og:description"
        content="Consulta este repuesto automotriz en Predicar Repuestos."
    >

    <meta
        id="og-url"
        property="og:url"
        content="https://claudiaandiav-ops.github.io/predicar-repuestos/producto.html"
    >

    <meta
        id="og-image"
        property="og:image"
        content="https://claudiaandiav-ops.github.io/predicar-repuestos/img/sinfoto.png"
    >

    <meta property="og:type" content="product">

    <link rel="stylesheet" href="css/style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script
        id="producto-schema"
        type="application/ld+json"
    >
    {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Repuesto automotriz"
    }
    </script>

</head>

<body>

<header>

    <a
        href="index.html"
        aria-label="Volver al inicio de Predicar Repuestos"
    >
        <h1>🔧 PREDICAR REPUESTOS</h1>
    </a>

</header>

<main>

    <div class="detalle">

        <div class="imagen">

            <img
                id="foto"
                src="img/sinfoto.png"
                alt="Repuesto automotriz"
            >

        </div>

        <div class="info">

            <h2 id="descripcion">
                Cargando producto...
            </h2>

            <p>
                <strong>Código:</strong>
                <span id="codigo"></span>
            </p>

            <p>
                <strong>Marca:</strong>
                <span id="marca"></span>
            </p>

            <p>
                <strong>Modelo:</strong>
                <span id="modelo"></span>
            </p>

            <p>
                <strong>Precio:</strong>
                S/ <span id="precio"></span>
            </p>

            <p>
                <strong>Stock:</strong>
                <span id="stock"></span>
            </p>

            <p id="estado"></p>
            <section class="descripcion-seo">
    <h3>Información del repuesto</h3>

    <p id="texto-seo"></p>
</section>

            <a
                id="whatsapp"
                class="btn btn-success btn-lg mt-3"
                target="_blank"
                rel="noopener"
            >
                Consultar por WhatsApp
            </a>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/producto.js"></script>

</body>

</html>
