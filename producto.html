<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del Producto</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<header>

    <h1>🔧 PREDICAR REPUESTOS</h1>

</header>

<div class="detalle">

    <div class="imagen">

        <img id="foto" src="https://placehold.co/500x400?text=Sin+Foto">

    </div>

    <div class="info">

        <h2 id="descripcion"></h2>

        <p><strong>Código:</strong> <span id="codigo"></span></p>

        <p><strong>Marca:</strong> <span id="marca"></span></p>

        <p><strong>Modelo:</strong> <span id="modelo"></span></p>
        <p><strong>Precio:</strong> S/ <span id="precio"></span></p>

<p><strong>Stock:</strong> <span id="stock"></span></p>

<p id="estado"></p>

        <a id="whatsapp"
           class="btn btn-success btn-lg mt-3"
           target="_blank">

            Consultar por WhatsApp

        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/producto.js"></script>

</body>

</html>
